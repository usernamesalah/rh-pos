services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/tmp
    working_dir: /app
    command: air -c .air.toml
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"      # S3 API
      - "9001:9001"      # Web UI
    volumes:
      - ./data:/data
    environment:
      MINIO_ROOT_USER: usernamesalah-minio
      MINIO_ROOT_PASSWORD: 4kuGanteng1607!@#

      # Untuk signed URL agar domain publik digunakan, bukan minio:9000
      MINIO_SERVER_URL: https://upload.pudinglab.my.id

      # Redirect console agar akses UI tidak ke http://minio:9001
      MINIO_BROWSER_REDIRECT_URL: https://console.pudinglab.my.id
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - default

networks:
  default:
    external:
      name: usernamesalah
